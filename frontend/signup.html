<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Haven - Sign Up</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #35104f 0%, #8f5bb3 45%, #f3a6c8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.signup-card {
    width: 100%;
    max-width: 430px;
    background: #c8a2e8;
    color: #35104f;
    border-radius: 24px;
    padding: 38px;
    box-shadow: 0 18px 45px rgba(45, 10, 65, 0.30);
    text-align: center;
}

.logo {
    font-size: 3rem;
    margin-bottom: 6px;
}

h1 {
    font-size: 2rem;
    margin-bottom: 8px;
}

.subtitle {
    color: #4a2460;
    font-size: .95rem;
    margin-bottom: 26px;
}

.form-group {
    text-align: left;
    margin-bottom: 15px;
}

label {
    display: block;
    font-size: .9rem;
    font-weight: 600;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid transparent;
    border-radius: 12px;
    background: white;
    color: #35104f;
    font-size: 1rem;
    outline: none;
}

input:focus {
    border-color: #8f5bb3;
    box-shadow: 0 0 0 3px rgba(143, 91, 179, .2);
}

.signup-button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 14px;
    margin-top: 7px;
    background: linear-gradient(90deg, #d58bd2, #f19ab9);
    color: #35104f;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
}

.signup-button:hover {
    opacity: .92;
    transform: translateY(-1px);
}

.message {
    min-height: 20px;
    margin-top: 13px;
    font-size: .88rem;
    color: #5a286e;
}

.login-text {
    margin-top: 22px;
    color: #4a2460;
    font-size: .92rem;
}

.login-link {
    color: #35104f;
    font-weight: 700;
    text-decoration: none;
}

.login-link:hover {
    text-decoration: underline;
}
</style>
</head>

<body>
<main class="signup-card">
    <div class="logo">🐾</div>

    <h1>Create Account</h1>
    <p class="subtitle">Join the pet adventure!</p>

    <form id="signupForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Choose a username" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Create a password" required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   name="confirmPassword"
                   placeholder="Confirm your password" required>
        </div>

        <button type="submit" class="signup-button">Create Account</button>
        <p id="message" class="message"></p>
    </form>

    <p class="login-text">
        Already have an account?
        <a href="login.html" class="login-link">Login</a>
    </p>
</main>

<script>
document.getElementById("signupForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("message");

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
    }

    message.textContent = "Account creation will connect to the backend later!";
});
</script>
</body>
</html>
