<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Haven - Sign Up</title>
<style>
    .signup-avatar-options {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 7px;
    margin-top: 8px;
}

.signup-avatar-option {
    border: 2px solid transparent;
    background: white;
    border-radius: 12px;
    padding: 7px 4px;
    font-size: 1.35rem;
    cursor: pointer;
    transition: 0.2s;
}

.signup-avatar-option:hover {
    transform: translateY(-2px);
    border-color: #8f5bb3;
}

.signup-avatar-option.selected {
    border-color: #8c4fd6;
    background: #ead8f5;
    box-shadow: 0 0 0 2px rgba(140, 79, 214, 0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #35104f 0%, #8f5bb3 45%, #f3a6c8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.signup-card {
    width: 100%;
    max-width: 430px;
    background: #c8a2e8;
    color: #35104f;
    border-radius: 24px;
    padding: 38px;
    box-shadow: 0 18px 45px rgba(45, 10, 65, 0.30);
    text-align: center;
}

.logo {
    font-size: 3rem;
    margin-bottom: 6px;
}

h1 {
    font-size: 2rem;
    margin-bottom: 8px;
}

.subtitle {
    color: #4a2460;
    font-size: .95rem;
    margin-bottom: 26px;
}

.form-group {
    text-align: left;
    margin-bottom: 15px;
}

label {
    display: block;
    font-size: .9rem;
    font-weight: 600;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid transparent;
    border-radius: 12px;
    background: white;
    color: #35104f;
    font-size: 1rem;
    outline: none;
}

input:focus {
    border-color: #8f5bb3;
    box-shadow: 0 0 0 3px rgba(143, 91, 179, .2);
}

.signup-button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 14px;
    margin-top: 7px;
    background: linear-gradient(90deg, #d58bd2, #f19ab9);
    color: #35104f;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
}

.signup-button:hover {
    opacity: .92;
    transform: translateY(-1px);
}

.message {
    min-height: 20px;
    margin-top: 13px;
    font-size: .88rem;
    color: #5a286e;
}

.login-text {
    margin-top: 22px;
    color: #4a2460;
    font-size: .92rem;
}

.login-link {
    color: #35104f;
    font-weight: 700;
    text-decoration: none;
}

.login-link:hover {
    text-decoration: underline;
}
</style>
</head>

<body>
<main class="signup-card">
    <div class="logo">🐾</div>

    <h1>Create Account</h1>
    <p class="subtitle">Join the pet adventure!</p>

    <form id="signupForm" novalidate>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Choose a username" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                maxlength="254"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Create a password" required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   name="confirmPassword"
                   placeholder="Confirm your password" required>
        </div>
        <div class="form-group">

    <label>Choose your character</label>

    <div class="signup-avatar-options">

        <button type="button" class="signup-avatar-option selected"
                data-avatar="👩🏻">👩🏻</button>

        <button type="button" class="signup-avatar-option"
                data-avatar="👨🏻">👨🏻</button>

        <button type="button" class="signup-avatar-option"
                data-avatar="🐱">🐱</button>

        <button type="button" class="signup-avatar-option"
                data-avatar="🐶">🐶</button>

        <button type="button" class="signup-avatar-option"
                data-avatar="🐰">🐰</button>

        <button type="button" class="signup-avatar-option"
                data-avatar="🦊">🦊</button>

        <button type="button" class="signup-avatar-option"
                data-avatar="🐹">🐹</button>

        <button type="button" class="signup-avatar-option"
                data-avatar="🐢">🐢</button>

    </div>

</div>

        <button type="submit" class="signup-button">Create Account</button>
        <p id="message" class="message"></p>
    </form>

    <p class="login-text">
        Already have an account?
        <a href="login.html" class="login-link">Login</a>
    </p>
</main>

<script>

let selectedAvatar = "👩🏻";


// ===============================
// AVATAR SELECTION
// ===============================

document.querySelectorAll(".signup-avatar-option")
    .forEach(button => {

        button.addEventListener("click", function() {

            document
                .querySelectorAll(".signup-avatar-option")
                .forEach(btn =>
                    btn.classList.remove("selected")
                );

            this.classList.add("selected");

            selectedAvatar = this.dataset.avatar;
        });

    });


// ===============================
// SIGN UP
// ===============================

document.getElementById("signupForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const usernameInput = document.getElementById("username");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput =
            document.getElementById("confirmPassword");
        const message = document.getElementById("message");

        const username = usernameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        // Clear previous message
        message.textContent = "";
        message.style.color = "#b00020";

        // All fields are mandatory
        if (!username || !email || !password || !confirmPassword) {
            message.textContent = "Please fill in all fields.";
            return;
        }

        // Validate email format
const emailPattern =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if (!emailPattern.test(email)) {
    message.textContent =
        "Please enter a valid email address, such as name@gmail.com";
    emailInput.focus();
    return;
}

        // Require at least 8 characters
        if (password.length < 8) {
            message.textContent =
                "Password must contain at least 8 characters.";
            passwordInput.focus();
            return;
        }

        // Confirm password
        if (password !== confirmPassword) {
            message.textContent = "Passwords do not match.";
            confirmPasswordInput.focus();
            return;
        }
        // ===============================
        // CREATE NEW PROFILE
        // ===============================

        const profile = {
            name: username,
            username: username,
            email: email,
            avatar: selectedAvatar
        };


        localStorage.setItem(
            "cloudpet_profile",
            JSON.stringify(profile)
        );


        // Automatically log the new user in
        localStorage.setItem(
            "cloudpet_logged_in",
            "true"
        );


        message.textContent =
            "Account created successfully! 🐾";


        // Go directly to Home
        setTimeout(() => {

            window.location.href =
                "home.html";

        }, 500);

    });

</script>
</body>
</html>
