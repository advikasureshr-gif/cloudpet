<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudPet - Profile</title>

  <style>
    :root {
      --bg-deep: #2c1250; --bg-mid: #6a2f8f; --bg-light: #d68ecb;
      --card: #f2e6fb; --card-soft: #f8effc;
      --ink: #3a1a5c; --ink-soft: #6b4a8f;
      --pink: #ff6fa5; --purple: #8c4fd6;
      /* Tints are derived from the theme colours, so they follow the active theme */
      --tint: color-mix(in srgb, var(--purple) 16%, white);
      --line: color-mix(in srgb, var(--purple) 14%, white);
      --shadow: 0 12px 28px rgba(44, 18, 80, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 45%, var(--bg-light) 100%);
      background-attachment: fixed;
      padding-bottom: 50px;
    }

    a { text-decoration: none; color: inherit; }

    /* ---------- Navbar (same on every page) ---------- */
    .navbar {
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      padding: 16px 32px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      position: sticky; top: 0; z-index: 20;
    }
    .nav-brand { font-size: 1.2rem; font-weight: 800; color: #fff; }
    .nav-links { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); }
    .nav-links a { padding: 8px 18px; border-radius: 999px; color: rgba(255, 255, 255, 0.85); font-weight: 700; font-size: 0.92rem; transition: background 0.2s, color 0.2s; }
    .nav-links a:hover { background: rgba(255, 255, 255, 0.15); }
    .nav-links a.active { background: #fff; color: var(--purple); }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .coin-pill { padding: 8px 16px; border-radius: 999px; background: rgba(255, 255, 255, 0.15); color: #fff; font-weight: 800; font-size: 0.9rem; white-space: nowrap; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--pink), var(--purple)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; border: 2px solid rgba(255, 255, 255, 0.6); }
    .logout-link { color: rgba(255, 255, 255, 0.75); font-weight: 700; font-size: 0.85rem; }

    /* ---------- Page ---------- */
    main { width: min(1050px, 92%); margin: 40px auto; }
    .page-title { color: #fff; font-size: 2.2rem; margin-bottom: 8px; }
    .page-subtitle { color: rgba(255, 255, 255, 0.78); margin-bottom: 28px; }

    /* ---------- Profile card ---------- */
    .profile-card {
      background: var(--card); border-radius: 28px; padding: 30px; box-shadow: var(--shadow);
      display: grid; grid-template-columns: 180px 1fr; gap: 30px; align-items: center;
    }
    .profile-avatar {
      width: 150px; height: 150px; border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      display: flex; align-items: center; justify-content: center;
      font-size: 4rem; border: 6px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 10px 25px rgba(44, 18, 80, 0.25);
    }
    .profile-info h2 { margin-bottom: 8px; font-size: 1.8rem; }
    .profile-info p { color: var(--ink-soft); margin: 6px 0; }
    .profile-badge { display: inline-block; margin-top: 12px; padding: 7px 14px; border-radius: 999px; background: #fff; color: var(--purple); font-weight: 800; }

    .edit-profile-btn {
      display: block; margin-top: 18px; border: none; background: var(--purple); color: #fff;
      padding: 10px 18px; border-radius: 999px; font: inherit; font-weight: 800; cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .edit-profile-btn:hover { background: var(--pink); transform: translateY(-1px); }

    /* ---------- Edit form ---------- */
    .edit-form { display: none; margin-top: 18px; background: var(--card-soft); padding: 18px; border-radius: 20px; }
    .edit-form.open { display: block; }
    .edit-form input {
      width: 100%; padding: 11px 14px; margin-bottom: 10px;
      border: 2px solid var(--line); border-radius: 12px; background: #fff;
      color: var(--ink); font: inherit; font-size: 0.95rem; outline: none;
    }
    .edit-form input:focus { border-color: var(--purple); }
    .form-error { color: #b4234f; font-weight: 700; font-size: 0.88rem; margin-bottom: 10px; min-height: 1.2em; }

    .avatar-selection { margin: 4px 0 14px; }
    .avatar-selection label { display: block; font-weight: 800; margin-bottom: 10px; }
    .avatar-options { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
    .avatar-option { border: 2px solid transparent; background: #fff; border-radius: 14px; padding: 8px; font-size: 1.5rem; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .avatar-option:hover { transform: translateY(-2px); border-color: var(--purple); }
    .avatar-option.selected { border-color: var(--purple); background: var(--tint); }

    .edit-actions { display: flex; gap: 10px; }
    .edit-actions button { border: none; padding: 9px 16px; border-radius: 999px; background: var(--purple); color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    .edit-actions button:hover { background: var(--pink); }
    .edit-actions .cancel-btn { background: var(--line); color: var(--ink); }
    .edit-actions .cancel-btn:hover { background: var(--tint); }

    /* ---------- Stats ---------- */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 22px; }
    .stat-card { background: var(--card); border-radius: 22px; padding: 22px; box-shadow: 0 10px 24px rgba(44, 18, 80, 0.25); text-align: center; }
    .stat-icon { font-size: 2rem; margin-bottom: 8px; }
    .stat-value { font-size: 1.7rem; font-weight: 900; color: var(--purple); }
    .stat-label { color: var(--ink-soft); margin-top: 4px; font-weight: 700; }

    /* ---------- My pets ---------- */
    .section { margin-top: 24px; background: var(--card); border-radius: 28px; padding: 26px; box-shadow: var(--shadow); }
    .section h2 { margin-bottom: 18px; }
    .pet-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .pet-mini { background: var(--card-soft); border-radius: 18px; padding: 16px; text-align: center; color: var(--ink-soft); transition: transform 0.18s; }
    .pet-mini:hover { transform: translateY(-3px); }
    .pet-mini-icon { font-size: 2.2rem; }
    .pet-mini-name { font-weight: 800; color: var(--ink); margin-top: 6px; }

    @media (max-width: 750px) {
      .navbar { flex-wrap: wrap; gap: 12px; padding: 14px 18px; }
      .nav-links { order: 3; width: 100%; justify-content: center; overflow-x: auto; }
      .nav-right { margin-left: auto; }
      .profile-card { grid-template-columns: 1fr; text-align: center; }
      .profile-avatar { margin: auto; }
      .edit-form { text-align: left; }
      .avatar-options { grid-template-columns: repeat(4, 1fr); }
      .stats-grid, .pet-summary { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <a href="home.html" class="nav-brand">🐾 Pet Haven</a>

    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="ai-chat.html">AI Chat</a>
      <a href="shop.html">Shop</a>
      <a href="coins.html">Coins</a>
      <a href="profile.html" class="active">Profile</a>
    </div>

    <div class="nav-right">
      <div class="coin-pill" id="coinDisplay">🪙 …</div>
      <div class="avatar">L</div>
      <a href="login.html" class="logout-link">Logout</a>
    </div>
  </nav>

  <main>

    <h1 class="page-title">My Profile 👤</h1>
    <p class="page-subtitle">Your CloudPet journey at a glance.</p>

    <section class="profile-card">

      <div class="profile-avatar" id="profileAvatar">👩🏻</div>

      <div class="profile-info">
        <h2 id="profileName">Pet Parent</h2>
        <p>🌸 CloudPet member</p>
        <p>🐾 Caring for your virtual pets</p>
        <span class="profile-badge">✨ Pet Lover</span>

        <button type="button" class="edit-profile-btn" id="editBtn">✏️ Edit Profile</button>

        <div class="edit-form" id="editForm">
          <input type="text" id="editName" placeholder="Your name" maxlength="40" aria-label="Your name">
          <input type="email" id="editEmail" placeholder="Your email" aria-label="Your email">

          <div class="avatar-selection">
            <label>Choose your character</label>
            <div class="avatar-options" id="avatarOptions"></div>
          </div>

          <div class="form-error" id="formError" role="alert"></div>

          <div class="edit-actions">
            <button type="button" id="saveBtn">💾 Save</button>
            <button type="button" class="cancel-btn" id="cancelBtn">Cancel</button>
          </div>
        </div>
      </div>

    </section>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🪙</div>
        <div class="stat-value" id="coinStat">0</div>
        <div class="stat-label">Coins</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">🐾</div>
        <div class="stat-value" id="petStat">1</div>
        <div class="stat-label">Pets</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">🏆</div>
        <div class="stat-value" id="achievementStat">0</div>
        <div class="stat-label">Achievements</div>
      </div>
    </div>

    <section class="section">
      <h2>🐾 My Pets</h2>
      <div class="pet-summary" id="petSummary"></div>
    </section>

  </main>

  <script src="js/state.js"></script>
  <script src="js/config.js"></script>
<script src="js/api.js"></script>
  <script>
    const AVATARS = ["👩🏻", "👨🏻", "🐱", "🐈‍⬛", "🐶", "🐕", "🐰", "🌸"];
    const $ = id => document.getElementById(id);

    let profile = null;          // { name, email, avatar, coins, ... } from the server
    let selectedAvatar = null;

    function showProfile() {
      $("profileName").textContent = profile.name;
      $("profileAvatar").textContent = profile.avatar;
      $("coinStat").textContent = profile.coins;
    }

    /* ---------- Avatar picker ---------- */
    function markSelectedAvatar() {
      document.querySelectorAll(".avatar-option").forEach(button => {
        button.classList.toggle("selected", button.dataset.avatar === selectedAvatar);
      });
    }

    AVATARS.forEach(emoji => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "avatar-option";
      button.dataset.avatar = emoji;
      button.textContent = emoji;
      button.addEventListener("click", () => {
        selectedAvatar = emoji;
        markSelectedAvatar();
      });
      $("avatarOptions").appendChild(button);
    });

    /* ---------- Edit / save / cancel ---------- */
    function openEditor() {
      if (!profile) return;
      $("editName").value = profile.name;
      $("editEmail").value = profile.email;
      $("formError").textContent = "";
      selectedAvatar = profile.avatar;
      markSelectedAvatar();
      $("editForm").classList.add("open");
      $("editName").focus();
    }

    function closeEditor() {
      $("editForm").classList.remove("open");
    }

    async function saveProfile() {
      const name = $("editName").value.trim();
      const email = $("editEmail").value.trim();

      if (!name || !email) {
        $("formError").textContent = "Please enter your name and email.";
        return;
      }

      $("saveBtn").disabled = true;
      try {
        profile = await api.updateMe({ name, email, avatar: selectedAvatar });   // the server checks it too
        showProfile();
        closeEditor();
      } catch (err) {
        $("formError").textContent = err.message;
      } finally {
        $("saveBtn").disabled = false;
      }
    }

    $("editBtn").addEventListener("click", openEditor);
    $("saveBtn").addEventListener("click", saveProfile);
    $("cancelBtn").addEventListener("click", closeEditor);

    /* ---------- My pets ---------- */
    function showPets(pets, kinds) {
      const list = $("petSummary");
      list.innerHTML = "";

      pets.forEach(p => {
        const kind = kinds[p.type];
        if (!kind) return;

        const card = document.createElement("a");
        card.className = "pet-mini";
        card.href = "pet.html?pet=" + encodeURIComponent(p.uid);

        const icon = document.createElement("div");
        icon.className = "pet-mini-icon";
        icon.textContent = kind.emoji;

        const name = document.createElement("div");
        name.className = "pet-mini-name";
        name.textContent = p.name;

        card.append(icon, name, kind.species);
        list.appendChild(card);
      });

      $("petStat").textContent = pets.length;
    }

    async function load() {
      try {
        const [me, petData, catalog, quests] = await Promise.all([api.me(), api.pets(), api.catalog(), api.quests()]);
        profile = me;
        showProfile();
        showPets(petData.pets, Object.fromEntries(catalog.pets.map(p => [p.type, p])));
        $("achievementStat").textContent = quests.achievements.filter(a => a.unlocked).length;
      } catch (err) {
        api.showError(err);
      }
    }

    load();
    window.addEventListener("pageshow", e => { if (e.persisted) load(); });
  </script>

</body>
</html>
