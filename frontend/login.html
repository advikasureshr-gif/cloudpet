<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Haven - Login</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #35104f 0%, #8f5bb3 45%, #f3a6c8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}
.login-card {
    width: 100%;
    max-width: 430px;
    background: #c8a2e8;
    color: #35104f;
    border-radius: 24px;
    padding: 42px 38px;
    box-shadow: 0 18px 45px rgba(45, 10, 65, 0.30);
    text-align: center;
}
.logo { font-size: 3rem; margin-bottom: 8px; }
h1 { font-size: 2rem; margin-bottom: 8px; }
.subtitle { color: #4a2460; font-size: .95rem; margin-bottom: 30px; }
.form-group { text-align: left; margin-bottom: 18px; }
label { display: block; font-size: .9rem; font-weight: 600; margin-bottom: 8px; }
input {
    width: 100%;
    padding: 13px 15px;
    border: 2px solid transparent;
    border-radius: 12px;
    background: white;
    color: #35104f;
    font-size: 1rem;
    outline: none;
}
input:focus { border-color: #e6a5d4; box-shadow: 0 0 0 3px rgba(230,165,212,.2); }
.login-button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 14px;
    margin-top: 8px;
    background: linear-gradient(90deg, #d58bd2, #f19ab9);
    color: #35104f;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
}
.login-button:hover { opacity: .92; transform: translateY(-1px); }
.message { min-height: 20px; margin-top: 14px; font-size: .88rem; color: #5a286e; }
.signup-text { margin-top: 25px; color: #4a2460; font-size: .92rem; }
.signup-link { color: #35104f; font-weight: 700; text-decoration: none; }
.signup-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<main class="login-card">
    <div class="logo">🐾</div>
    <h1>Welcome Back!</h1>
    <p class="subtitle">Log in to continue your pet adventure.</p>

    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email / Username</label>
            <input type="text" id="email" name="email"
                   placeholder="Enter your email or username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-button">Login</button>
        <p id="message" class="message"></p>
    </form>

    <p class="signup-text">
        Don't have an account?
        <a href="signup.html" class="signup-link">Sign Up</a>
    </p>
</main>

<script>
document.getElementById("loginForm")
  .addEventListener("submit", function(event) {
    event.preventDefault();

    const enteredLogin =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");

    message.textContent = "";
    message.style.color = "#ff6b81";

    // Check that both fields are filled
    if (!enteredLogin || !password) {
      message.textContent =
        "Please enter your email/username and password.";
      return;
    }

    const profileData =
      localStorage.getItem("cloudpet_profile");

    if (!profileData) {
      message.textContent =
        "No CloudPet account found. Please sign up first.";
      return;
    }

    const profile = JSON.parse(profileData);
    const enteredValue = enteredLogin.toLowerCase();

    // Check email or username
    if (
      enteredValue !== (profile.email || "").toLowerCase() &&
      enteredValue !==
        (profile.username || profile.name || "").toLowerCase()
    ) {
      message.textContent =
        "Email or username not found.";
      return;
    }

    // Prototype only: password verification will be handled
    // by Amazon Cognito during AWS integration.
    localStorage.setItem("cloudpet_logged_in", "true");

    message.style.color = "#8b5cf6";
    message.textContent =
      "Welcome back, " + profile.name + "! 🐾";

    setTimeout(() => {
      window.location.href = "home.html";
    }, 800);
  });
</script>
</body>
</html>
