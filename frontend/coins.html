<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coins - Pet Haven</title>

  <style>
    :root {
      --bg-deep: #2c1250; --bg-mid: #6a2f8f; --bg-light: #d68ecb;
      --card: #f2e6fb; --card-soft: #f8effc;
      --ink: #3a1a5c; --ink-soft: #6b4a8f;
      --pink: #ff6fa5; --purple: #8c4fd6;
      /* Derived from the theme colours, so they follow whichever theme is active */
      --tint: color-mix(in srgb, var(--purple) 16%, white);
      --line: color-mix(in srgb, var(--purple) 14%, white);
      --gold: #a47712;
      --shadow: 0 12px 28px rgba(44, 18, 80, 0.35);
      --radius-lg: 28px; --radius-md: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; }

    body {
      background: linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 45%, var(--bg-light) 100%);
      background-attachment: fixed;
      color: var(--ink);
      min-height: 100vh;
    }

    a { text-decoration: none; color: inherit; }

    /* ---------- Navbar (same on every page) ---------- */
    .navbar {
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      padding: 16px 32px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      position: sticky; top: 0; z-index: 20;
    }
    .nav-brand { font-size: 1.2rem; font-weight: 800; color: #fff; }
    .nav-links { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); }
    .nav-links a { padding: 8px 18px; border-radius: 999px; color: rgba(255, 255, 255, 0.85); font-weight: 700; font-size: 0.92rem; transition: background 0.2s, color 0.2s; }
    .nav-links a:hover { background: rgba(255, 255, 255, 0.15); }
    .nav-links a.active { background: #fff; color: var(--purple); }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .coin-pill { padding: 8px 16px; border-radius: 999px; background: rgba(255, 255, 255, 0.15); color: #fff; font-weight: 800; font-size: 0.9rem; white-space: nowrap; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--pink), var(--purple)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; border: 2px solid rgba(255, 255, 255, 0.6); }
    .logout-link { color: rgba(255, 255, 255, 0.75); font-weight: 700; font-size: 0.85rem; }

    /* ---------- Page ---------- */
    .container { max-width: 1150px; margin: auto; padding: 40px 25px 60px; }

    .hero {
      background: linear-gradient(135deg, var(--card-soft), var(--card));
      border-radius: var(--radius-lg); padding: 35px;
      display: flex; justify-content: space-between; align-items: center; gap: 20px;
      margin-bottom: 10px; box-shadow: var(--shadow);
    }
    .hero h1 { font-size: 34px; margin-bottom: 10px; font-weight: 800; }
    .hero p { color: var(--ink-soft); font-size: 16px; }

    .balance { background: var(--card-soft); border-radius: var(--radius-md); padding: 20px 30px; text-align: center; box-shadow: 0 8px 25px rgba(70, 50, 110, 0.08); }
    .balance-label { color: var(--ink-soft); font-size: 14px; margin-bottom: 5px; }
    .balance-number { font-size: 32px; font-weight: bold; color: var(--gold); }

    .section { margin-top: 35px; }
    .section-title { font-size: 24px; margin-bottom: 18px; color: #fff; display: flex; align-items: baseline; gap: 12px; }
    .section-title small { font-size: 0.8rem; font-weight: 700; color: rgba(255, 255, 255, 0.8); }

    .grid { display: grid; gap: 18px; }
    .grid.quests { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .grid.rewards { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

    /* ---------- Cards ---------- */
    .card { background: var(--card); border-radius: var(--radius-md); padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
    .card-icon { font-size: 30px; }
    .card h3 { font-size: 1.05rem; }
    .card p { color: var(--ink-soft); font-size: 14px; line-height: 1.5; flex: 1; }
    .reward { color: var(--gold); font-weight: bold; }
    .card.locked { background: rgba(230, 211, 245, 0.72); opacity: 0.75; filter: saturate(0.75); }
    .card.locked .card-icon { filter: grayscale(1); }
    .card.claimed { opacity: 0.8; }

    .progress-row { display: flex; align-items: center; gap: 12px; }
    .progress-track { flex: 1; height: 10px; border-radius: 999px; overflow: hidden; background: var(--line); }
    .progress-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--pink), var(--purple)); transition: width 0.4s ease; }
    .progress-text { font-weight: 800; font-size: 0.85rem; min-width: 38px; text-align: right; }

    .quest-button { border: none; background: var(--purple); color: #fff; padding: 10px 16px; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 0.95rem; transition: background 0.2s, transform 0.2s; }
    .quest-button:hover:not(:disabled) { background: var(--pink); transform: translateY(-1px); }
    .quest-button:disabled { background: var(--line); color: var(--ink-soft); cursor: default; }
    .quest-button.completed:disabled { background: var(--tint); color: var(--ink); }
    .quest-button.ready { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--purple) 25%, transparent); } }

    .bonus-card { margin-top: 18px; background: rgba(255, 255, 255, 0.14); color: #fff; border-radius: 20px; padding: 16px 20px; font-weight: 700; }
    .bonus-card.done { background: rgba(255, 255, 255, 0.28); }

    /* ---------- Notification ---------- */
    .notification { position: fixed; top: 90px; right: 30px; background: var(--card); color: var(--ink); padding: 16px 22px; border-radius: 14px; box-shadow: var(--shadow); display: none; max-width: min(420px, 90vw); font-weight: 700; z-index: 9999; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    @media (max-width: 850px) {
      .navbar { flex-wrap: wrap; padding: 14px 18px; }
      .nav-links { order: 3; width: 100%; overflow-x: auto; justify-content: center; }
      .nav-links a { padding: 9px 12px; white-space: nowrap; }
      .nav-right { margin-left: auto; }
      .hero { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

<body>

  <div id="notification" class="notification" role="status"></div>

  <nav class="navbar">
    <div class="nav-brand">🐾 Pet Haven</div>

    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="ai-chat.html">AI Chat</a>
      <a href="shop.html">Shop</a>
      <a href="coins.html" class="active">Coins</a>
      <a href="profile.html">Profile</a>
    </div>

    <div class="nav-right">
      <div class="coin-pill" id="navCoins">🪙 …</div>
      <div class="avatar">🐾</div>
      <a href="login.html" class="logout-link">Logout</a>
    </div>
  </nav>

  <main class="container">

    <section class="hero">
      <div>
        <h1>🪙 Earn Coins</h1>
        <p>Complete quests, unlock achievements and discover hidden surprises!</p>
      </div>
      <div class="balance">
        <div class="balance-label">Your Balance</div>
        <div class="balance-number" id="coinBalance">🪙 …</div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">🎯 Daily Quests <small>Resets every day</small></h2>
      <div class="grid quests" id="questGrid"></div>
      <div class="bonus-card" id="bonusCard"></div>
    </section>

    <section class="section">
      <h2 class="section-title">🏆 Achievements <small id="achievementCount"></small></h2>
      <div class="grid rewards" id="achievementGrid"></div>
    </section>

    <section class="section">
      <h2 class="section-title">🔮 Hidden Discoveries <small id="hiddenCount"></small></h2>
      <div class="grid rewards" id="hiddenGrid"></div>
    </section>

    <section class="section">
      <h2 class="section-title">🐾 Pet-Specific Discoveries <small id="petCount"></small></h2>
      <div class="grid rewards" id="petGrid"></div>
    </section>

  </main>

  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };

    function notify(message) {
      const box = $("notification");
      box.textContent = message;
      box.style.display = "block";
      clearTimeout(notify.timer);
      notify.timer = setTimeout(() => { box.style.display = "none"; }, 3200);
    }

    function showCoins(n) {
      $("coinBalance").textContent = "🪙 " + n;
      $("navCoins").textContent = "🪙 " + n;
    }

    /* ---------- Daily quests (progress and claiming happen on the server) ---------- */
    function renderQuests(data) {
      const grid = $("questGrid");
      grid.replaceChildren();

      data.quests.forEach(quest => {
        const complete = quest.progress >= quest.goal;
        const card = el("div", "card" + (quest.claimed ? " claimed" : ""));

        const bar = el("div", "progress-row");
        const track = el("div", "progress-track");
        const fill = el("div", "progress-fill");
        fill.style.width = (quest.progress / quest.goal * 100) + "%";
        track.appendChild(fill);
        bar.append(track, el("div", "progress-text", quest.progress + " / " + quest.goal));

        const button = el("button", "quest-button" + (quest.claimed ? " completed" : complete ? " ready" : ""),
          quest.claimed ? "Completed ✓" : complete ? "Claim Reward" : "In progress");
        button.type = "button";
        button.disabled = quest.claimed || !complete;
        button.addEventListener("click", () => claimQuest(quest, button));

        card.append(el("div", "card-icon", quest.icon), el("h3", "", quest.title), el("p", "", quest.desc),
          el("div", "reward", "🪙 +" + quest.reward + " Coins"), bar, button);
        grid.appendChild(card);
      });

      const left = data.quests.filter(q => !q.claimed).length;
      const bonus = $("bonusCard");
      bonus.className = "bonus-card" + (data.bonus.claimed ? " done" : "");
      bonus.textContent = data.bonus.claimed
        ? "🎉 All quests claimed today. Bonus +" + data.bonus.reward + " coins collected!"
        : "⭐ Claim all " + data.quests.length + " quests today for a bonus of 🪙 " + data.bonus.reward + " (" + left + " to go).";
    }

    /* ---------- Achievements and discoveries ---------- */
    function rewardCard(r) {
      const card = el("div", "card" + (r.claimed ? " claimed" : r.unlocked ? "" : " locked"));

      const label = r.claimed ? "Claimed ✓"
        : r.unlocked ? "Claim Reward"
        : r.hidden ? "🔒 Hidden • 🪙 +" + r.reward
        : "🔒 Locked • 🪙 +" + r.reward;

      const button = el("button", "quest-button" + (r.claimed ? " completed" : r.unlocked ? " ready" : ""), label);
      button.type = "button";
      button.disabled = r.claimed || !r.unlocked;
      button.addEventListener("click", () => claimReward(r, button));

      card.append(el("div", "card-icon", r.icon), el("h3", "", r.title), el("p", "", r.desc));
      if (r.unlocked || r.claimed) card.appendChild(el("div", "reward", "🪙 +" + r.reward + " Coins"));
      card.appendChild(button);
      return card;
    }

    function fillGrid(id, list, countId) {
      const grid = $(id);
      grid.replaceChildren(...list.map(rewardCard));
      $(countId).textContent = list.filter(r => r.claimed).length + " / " + list.length + " collected";
    }

    function renderRewards(data) {
      fillGrid("achievementGrid", data.achievements, "achievementCount");
      fillGrid("hiddenGrid", data.discoveries.filter(d => d.group === "hidden"), "hiddenCount");
      fillGrid("petGrid", data.discoveries.filter(d => d.group === "pet"), "petCount");
    }

    /* ---------- Claiming ---------- */
    async function claimQuest(quest, button) {
      button.disabled = true;
      try {
        const result = await api.claim(quest.id);
        const bonus = result.earned - quest.reward;
        notify("🎉 You earned " + result.earned + " coins!" + (bonus ? " (includes the +" + bonus + " all-quests bonus!)" : "") + " Your pet is proud of you! 🐾");
        showCoins(result.coins);
        renderQuests(result);
        renderRewards(await api.rewards());           // finishing every quest can unlock Pet Haven Pro
      } catch (err) {
        api.showError(err);
        load();                                       // show the real state again
      }
    }

    async function claimReward(reward, button) {
      button.disabled = true;
      try {
        const result = await api.claimReward(reward.id);
        notify(reward.icon + " " + reward.title + "! You earned " + result.earned + " coins! ✨");
        showCoins(result.coins);
        renderRewards(result);
      } catch (err) {
        api.showError(err);
        load();
      }
    }

    async function load() {
      try {
        const [me, quests, rewards] = await Promise.all([api.me(), api.quests(), api.rewards()]);
        showCoins(me.coins);
        renderQuests(quests);
        renderRewards(rewards);
      } catch (err) {
        api.showError(err);
      }
    }

    load();
    window.addEventListener("pageshow", e => { if (e.persisted) load(); });     // back button: refresh
  </script>

</body>
</html>
