<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Haven — Home</title>
<style>
  :root {
    --bg-deep: #2c1250; --bg-mid: #6a2f8f; --bg-light: #d68ecb;
    --card: #f2e6fb; --card-soft: #f8effc;
    --ink: #3a1a5c; --ink-soft: #6b4a8f;
    --pink: #ff6fa5; --purple: #8c4fd6;
    --shadow: 0 12px 28px rgba(44, 18, 80, 0.35);
    --radius-lg: 28px; --radius-md: 20px; --radius-sm: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 45%, var(--bg-light) 100%);
    background-attachment: fixed; color: var(--ink); min-height: 100vh;
  }
  a { text-decoration: none; color: inherit; }

  /* ---------- Navbar ---------- */
  .navbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.15); position: sticky; top: 0; z-index: 20;
  }
  .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.2rem; color: #fff; letter-spacing: 0.2px; }
  .nav-links { display: flex; gap: 6px; background: rgba(255, 255, 255, 0.1); padding: 6px; border-radius: 999px; }
  .nav-links a { padding: 8px 18px; border-radius: 999px; color: rgba(255, 255, 255, 0.85); font-weight: 700; font-size: 0.92rem; transition: background 0.2s ease, color 0.2s ease; }
  .nav-links a:hover { background: rgba(255, 255, 255, 0.15); }
  .nav-links a.active { background: #fff; color: var(--purple); }
  .nav-right { display: flex; align-items: center; gap: 14px; }
  .coin-pill { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.15); padding: 8px 16px; border-radius: 999px; color: #fff; font-weight: 800; font-size: 0.9rem; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--pink), var(--purple)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 1rem; border: 2px solid rgba(255, 255, 255, 0.6); }
  .logout-link { color: rgba(255, 255, 255, 0.75); font-weight: 700; font-size: 0.85rem; }

  /* ---------- Main ---------- */
  .main { max-width: 1080px; margin: 0 auto; padding: 36px 28px 64px; }
  .greeting h1 { color: #fff; font-size: 1.8rem; margin: 0 0 4px; }
  .greeting p { color: rgba(255, 255, 255, 0.8); margin: 0 0 28px; font-size: 1rem; }
  .top-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 36px; }
  .card { background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 22px 24px; }

  .weather-card { display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, var(--card-soft), var(--card)); }
  .weather-icon { font-size: 3rem; line-height: 1; }
  .weather-info h2 { margin: 0 0 2px; font-size: 1.6rem; }
  .weather-info .temp { font-size: 1rem; color: var(--ink-soft); font-weight: 700; }
  .weather-note { margin-top: 8px; font-size: 0.85rem; color: var(--ink-soft); max-width: 190px; text-align: right; }

  .predict-card { display: flex; align-items: center; gap: 16px; margin-bottom: 36px; }
  .predict-icon { font-size: 2.2rem; line-height: 1; }
  .predict-title { font-weight: 800; font-size: 1.05rem; }
  .predict-sub { color: var(--ink-soft); font-size: 0.85rem; margin-top: 2px; }

  .quest-card .quest-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .quest-coins { font-size: 1.25rem; font-weight: 800; }
  .quest-title { font-weight: 800; margin: 6px 0 4px; font-size: 1rem; }
  .quest-desc { color: var(--ink-soft); font-size: 0.88rem; margin-bottom: 12px; }
  .progress-track { background: #e6d3f5; border-radius: 999px; height: 10px; overflow: hidden; margin-bottom: 14px; }
  .progress-fill { height: 100%; width: 50%; background: linear-gradient(90deg, var(--pink), var(--purple)); border-radius: 999px; }
  .quest-btn { display: inline-block; background: var(--purple); color: #fff; font-weight: 700; font-size: 0.85rem; padding: 9px 18px; border-radius: 999px; transition: transform 0.15s ease, background 0.2s ease; }
  .quest-btn:hover { background: var(--pink); transform: translateY(-1px); }

  /* Pets section */
  .section-title { color: #fff; font-size: 1.25rem; margin: 0 0 18px; display: flex; align-items: center; gap: 8px; }
  .pet-count { font-size: 0.85rem; font-weight: 800; background: rgba(255, 255, 255, 0.18); padding: 4px 12px; border-radius: 999px; }
  .pet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .pet-card { background: var(--card); border-radius: var(--radius-md); box-shadow: var(--shadow); padding: 18px; text-align: center; transition: transform 0.18s ease, box-shadow 0.18s ease; cursor: pointer; }
  .pet-card:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(44, 18, 80, 0.42); }
  .pet-avatar { width: 78px; height: 78px; margin: 0 auto 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; background: linear-gradient(135deg, #ffd6ec, #d9b8fb); }
  .pet-name { font-weight: 800; font-size: 1.05rem; margin-bottom: 2px; }
  .pet-breed { color: var(--ink-soft); font-size: 0.82rem; margin-bottom: 12px; }
  .pet-stats { display: flex; justify-content: center; gap: 14px; font-size: 0.82rem; font-weight: 700; color: var(--ink); margin-bottom: 14px; }
  .pet-stats span { white-space: nowrap; }
  .view-pet { display: inline-block; font-size: 0.82rem; font-weight: 800; color: var(--purple); border: 2px solid var(--purple); border-radius: 999px; padding: 6px 16px; transition: background 0.2s ease, color 0.2s ease; }
  .pet-card:hover .view-pet { background: var(--purple); color: #fff; }

  /* "Adopt another" slot */
  .pet-card.adopt { background: rgba(255, 255, 255, 0.12); box-shadow: none; border: 2px dashed rgba(255, 255, 255, 0.55); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 230px; }
  .pet-card.adopt:hover { background: rgba(255, 255, 255, 0.2); }
  .adopt-plus { font-size: 2.6rem; line-height: 1; margin-bottom: 8px; }
  .adopt-title { font-weight: 800; }
  .adopt-sub { font-size: 0.82rem; opacity: 0.85; margin-top: 4px; }

  @media (max-width: 760px) {
    .navbar { flex-wrap: wrap; gap: 12px; padding: 14px 18px; }
    .nav-links { order: 3; width: 100%; justify-content: center; }
    .top-row { grid-template-columns: 1fr; }
    .pet-grid { grid-template-columns: repeat(2, 1fr); }
    .weather-note { display: none; }
  }
  @media (max-width: 480px) {
    .pet-grid { grid-template-columns: 1fr 1fr; }
    .main { padding: 24px 16px 48px; }
  }
  @media (prefers-reduced-motion: reduce) { .pet-card, .quest-btn { transition: none; } }
  a:focus-visible, .pet-card:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">🐾 Pet Haven</div>
    <div class="nav-links">
      <a href="home.html" class="active">Home</a>
      <a href="ai-chat.html">AI Chat</a>
      <a href="shop.html">Shop</a>
      <a href="coins.html">Coins</a>
      <a href="profile.html">Profile</a>
    </div>
    <div class="nav-right">
      <div class="coin-pill" id="navCoins">🪙 …</div>
      <div class="avatar">L</div>
      <a href="login.html" class="logout-link">Logout</a>
    </div>
  </nav>

  <main class="main">
    <div class="greeting">
      <h1>Good morning, <span id="greetingName">Lexie</span>! 🌸</h1>
      <p>Here's how your pets are doing today.</p>
    </div>

    <div class="top-row">
      <div class="card weather-card">
        <div style="display:flex; align-items:center; gap:16px;">
          <div class="weather-icon" id="weatherIcon">☀️</div>
          <div class="weather-info">
            <h2 id="weatherName">Sunny</h2>
            <div class="temp" id="weatherTemp">28°C</div>
          </div>
        </div>
        <div class="weather-note" id="weatherNote"></div>
      </div>

      <div class="card quest-card">
        <div class="quest-header">
          <div class="quest-coins" id="questCoins">🪙 250 Coins</div>
        </div>
        <div class="quest-title">Today's Quest</div>
        <div class="quest-desc" id="questDesc">Loading…</div>
        <div class="progress-track"><div class="progress-fill" id="questFill"></div></div>
        <a href="quests.html" class="quest-btn">View Quests</a>
      </div>
    </div>

    <div class="card predict-card" id="predictCard">
      <div class="predict-icon">🔮</div>
      <div>
        <div class="predict-title" id="predictTitle">Learning when you visit…</div>
        <div class="predict-sub" id="predictSub"></div>
      </div>
    </div>

    <h2 class="section-title">My Pets 🐾 <span class="pet-count" id="petCount"></span></h2>
    <div class="pet-grid" id="petGrid"></div>
  </main>

  <script src="js/state.js"></script>
  <script src="js/config.js"></script>
<script src="js/api.js"></script>
  <script>
    function statOf(pet, key, fallback) {
      return pet.stats && typeof pet.stats[key] === "number" ? Math.round(pet.stats[key]) : fallback;
    }

    function petCard(pet, kind) {
      const card = document.createElement("a");
      card.className = "pet-card";
      card.href = "pet.html?pet=" + encodeURIComponent(pet.uid);
      card.tabIndex = 0;

      const avatar = document.createElement("div");
      avatar.className = "pet-avatar";
      avatar.textContent = kind.emoji;

      const name = document.createElement("div");
      name.className = "pet-name";
      name.textContent = pet.name;

      const breed = document.createElement("div");
      breed.className = "pet-breed";
      breed.textContent = kind.species;

      const stats = document.createElement("div");
      stats.className = "pet-stats";
      stats.innerHTML = "<span>❤️ " + statOf(pet, "health", 0) + "</span><span>🍖 " + statOf(pet, "hunger", 0) + "</span>";

      const view = document.createElement("span");
      view.className = "view-pet";
      view.textContent = "View Pet →";

      card.append(avatar, name, breed, stats, view);
      return card;
    }

    // Today's weather, and the pet the weather affects most
    async function renderWeather() {
      try {
        const w = await api.weather();
        document.getElementById("weatherIcon").textContent = w.icon;
        document.getElementById("weatherName").textContent = w.label;
        document.getElementById("weatherTemp").textContent = w.tempC + "°C";

        const strength = r => Math.abs(r.effect.happiness) + 2 * Math.abs(r.effect.health);
        const top = w.reactions.slice().sort((a, b) => strength(b) - strength(a))[0];
        document.getElementById("weatherNote").textContent = top ? top.message : "";
      } catch (err) { /* the weather card just keeps its last text */ }
    }

    // When your pets expect you (learned from your own activity by a Random Forest on the server)
    async function renderPrediction() {
      try {
        const p = await api.prediction();
        const title = document.getElementById("predictTitle");
        const sub = document.getElementById("predictSub");

        if (p.method === "none") {
          title.textContent = "Your pets are still learning when you usually visit";
          sub.textContent = "Care for them a few days in a row and they'll start to expect you.";
          return;
        }

        const when = new Date(p.nextCheckInAt);
        const time = when.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        const day = when.toDateString() === new Date().toDateString() ? "today" : "tomorrow";
        title.textContent = "Your pets expect you " + day + " around " + time;
        sub.textContent = (p.emailOn ? "A reminder email goes out about 30 minutes before. " : "Add your email on the Profile page to get a reminder. ") +
          "Learned from " + p.basedOnEvents + " visits" + (p.method === "forest" ? " by a Random Forest." : " (simple average so far).");
      } catch (err) { /* the card keeps its default text */ }
    }

    // Came here from the reminder email link (home.html?from=reminder): every pet gets happier, once per email
    async function welcomeBack() {
      if (new URLSearchParams(location.search).get("from") !== "reminder") return;
      history.replaceState(null, "", location.pathname);
      try {
        const r = await api.reminderReturn();
        api.toast("💕 Welcome back! Your pets missed you: happiness +" + r.boost + " 🐾");
      } catch (err) {
        if (err.status === 409) api.toast("💕 Welcome back!");       // already used, or expired
        else api.showError(err);
      }
    }

    async function renderHome() {
      await welcomeBack();
      renderWeather();
      renderPrediction();
      try {
        const [me, petData, quests, catalog] = await Promise.all([api.me(), api.pets(), api.quests(), api.catalog()]);

        document.getElementById("questCoins").textContent = "🪙 " + me.coins + " Coins";
        document.getElementById("greetingName").textContent = me.name;

        const done = quests.quests.filter(q => q.progress >= q.goal).length;
        const unclaimed = quests.quests.filter(q => q.progress >= q.goal && !q.claimed).length;
        document.getElementById("questDesc").textContent =
          done + " / " + quests.quests.length + " daily quests done" + (unclaimed ? " · rewards ready!" : "");
        document.getElementById("questFill").style.width = (done / quests.quests.length * 100) + "%";

        const maxPets = catalog.maxPets;
        document.getElementById("petCount").textContent = petData.pets.length + " / " + maxPets;

        const kinds = Object.fromEntries(catalog.pets.map(p => [p.type, p]));
        const grid = document.getElementById("petGrid");
        grid.innerHTML = "";
        petData.pets.forEach(p => { if (kinds[p.type]) grid.appendChild(petCard(p, kinds[p.type])); });

        if (petData.pets.length < maxPets) {
          const left = maxPets - petData.pets.length;
          const adopt = document.createElement("a");
          adopt.className = "pet-card adopt";
          adopt.href = "shop.html";
          adopt.innerHTML =
            '<div class="adopt-plus">＋</div>' +
            '<div class="adopt-title">Adopt another pet</div>' +
            '<div class="adopt-sub">Visit the shop · ' + left + ' space' + (left === 1 ? "" : "s") + ' left</div>';
          grid.appendChild(adopt);
        }
      } catch (err) {
        api.showError(err);
      }
    }

    renderHome();
    window.addEventListener("pageshow", e => { if (e.persisted) renderHome(); });   // back button: refresh
  </script>

</body>
</html>
