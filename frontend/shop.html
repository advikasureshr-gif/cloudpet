<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Haven — Shop</title>

  <style>
    :root {
      --bg-deep: #2c1250;
      --bg-mid: #6a2f8f;
      --bg-light: #d68ecb;
      --card: #f2e6fb;
      --card-soft: #f8effc;
      --ink: #3a1a5c;
      --ink-soft: #6b4a8f;
      --pink: #ff6fa5;
      --purple: #8c4fd6;
      --shadow: 0 12px 28px rgba(44, 18, 80, 0.35);
      --radius-lg: 28px;
      --radius-md: 20px;
      --radius-sm: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(
        160deg,
        var(--bg-deep) 0%,
        var(--bg-mid) 45%,
        var(--bg-light) 100%
      );
      background-attachment: fixed;
      color: var(--ink);
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ---------- Navbar ---------- */

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.2rem;
      color: #fff;
    }

    .nav-links {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px;
      border-radius: 999px;
    }

    .nav-links a {
      padding: 8px 18px;
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 700;
      font-size: 0.92rem;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .nav-links a:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .nav-links a.active {
      background: #fff;
      color: var(--purple);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .coin-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 999px;
      color: #fff;
      font-weight: 800;
      font-size: 0.9rem;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      border: 2px solid rgba(255, 255, 255, 0.6);
    }

    .logout-link {
      color: rgba(255, 255, 255, 0.75);
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* ---------- Main ---------- */

    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 28px 64px;
    }

    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .shop-header h1 {
      color: #fff;
      font-size: 1.9rem;
      margin: 0 0 5px;
    }

    .shop-header p {
      color: rgba(255, 255, 255, 0.8);
      margin: 0;
    }

    .balance {
      background: var(--card);
      padding: 12px 20px;
      border-radius: 999px;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    /* ---------- Categories ---------- */

    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .category-btn {
      border: none;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .category-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .category-btn.active {
      background: #fff;
      color: var(--purple);
    }

    /* ---------- Products ---------- */

    .item-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .item-card {
      background: var(--card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow);
      padding: 20px;
      text-align: center;
      transition: transform 0.18s ease;
    }

    .item-card:hover {
      transform: translateY(-4px);
    }

    .item-icon {
      width: 85px;
      height: 85px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd6ec, #d9b8fb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
    }

    .item-name {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .item-description {
      color: var(--ink-soft);
      font-size: 0.82rem;
      min-height: 38px;
      margin-bottom: 12px;
    }

    .item-price {
      font-weight: 800;
      margin-bottom: 12px;
    }

    .buy-btn {
      border: none;
      background: var(--purple);
      color: #fff;
      padding: 9px 20px;
      border-radius: 999px;
      font-weight: 800;
      cursor: pointer;
    }

    .buy-btn:hover {
      background: var(--pink);
    }

    /* ---------- Empty state ---------- */

    .empty-message {
      color: #fff;
      text-align: center;
      font-weight: 700;
      display: none;
      padding: 40px;
    }
    /* ---------- Purchase Modal ---------- */

    .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(44, 18, 80, 0.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    }

    .purchase-modal {
    width: min(420px, 100%);
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 30px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(44, 18, 80, 0.5);
    animation: modalAppear 0.2s ease;
    }

    .modal-icon {
    width: 75px;
    height: 75px;
    margin: 0 auto 15px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd6ec, #d9b8fb);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    }

    .purchase-modal h2 {
    margin: 0 0 10px;
    color: var(--ink);
    }

    .purchase-modal p {
    color: var(--ink-soft);
    font-size: 1rem;
    margin-bottom: 24px;
    }

    .modal-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    }

    .modal-buttons button {
    border: none;
    padding: 10px 24px;
    border-radius: 999px;
    font-weight: 800;
    cursor: pointer;
    font-size: 0.9rem;
    }

    .cancel-btn {
    background: #e6d3f5;
    color: var(--ink);
    }

    .confirm-btn {
    background: var(--purple);
    color: #fff;
    }

    .cancel-btn:hover {
    background: #d8c0ed;
    }

    .confirm-btn:hover {
    background: var(--pink);
    }

    @keyframes modalAppear {
    from {
        opacity: 0;
        transform: scale(0.95);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
    }
    /* ---------- Notification ---------- */

    .notification {
        position: fixed;
        top: 90px;
        right: 30px;
        background: var(--card);
        color: var(--ink);
        padding: 14px 20px;
        border-radius: 16px;
        box-shadow: var(--shadow);
        display: none;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        z-index: 200;
        animation: notificationAppear 0.25s ease;
    }

    @keyframes notificationAppear {
        from {
            opacity: 0;
            transform: translateX(20px);
        }

        to {
            opacity: 1;
            transform: translateX(0);
        }
    }
    /* ---------- Inventory ---------- */

    .inventory-section {
    background: rgba(255, 255, 255, 0.12);
    border-radius: var(--radius-lg);
    padding: 22px;
    margin-bottom: 30px;
    }

    .inventory-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    }

    .inventory-header h2 {
    color: #fff;
    margin: 0;
    font-size: 1.2rem;
    }

    .inventory-header span {
    color: rgba(255, 255, 255, 0.8);
    font-weight: 700;
    }

    .inventory-list {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    }

    .inventory-item {
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    }

    .inventory-item-icon {
    font-size: 1.4rem;
    }

    .inventory-empty {
    color: rgba(255, 255, 255, 0.75);
    font-weight: 700;
    }
    /* ---------- Responsive ---------- */

    @media (max-width: 850px) {
      .item-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .shop-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
    }

    @media (max-width: 600px) {
      .navbar {
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px 18px;
      }

      .nav-links {
        order: 3;
        width: 100%;
        justify-content: center;
      }

      .item-grid {
        grid-template-columns: 1fr 1fr;
      }

      .main {
        padding: 24px 16px 48px;
      }
    }
  </style>
</head>

<body>

  <!-- ---------- Navigation ---------- -->

  <nav class="navbar">

    <div class="nav-brand">
      🐾 Pet Haven
    </div>

    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="ai-chat.html">AI Chat</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="coins.html">Coins</a>
      <a href="profile.html">Profile</a>
    </div>

    <div class="nav-right">
      <div class="coin-pill" id="navCoins">
        🪙 250
      </div>

      <div class="avatar">
        L
      </div>

      <a href="login.html" class="logout-link">
        Logout
      </a>
    </div>

  </nav>


  <!-- ---------- Main Shop ---------- -->

  <main class="main">

    <div class="shop-header">

      <div>
        <h1>Pet Shop 🛒</h1>
        <p>Everything your pets need to stay happy!</p>
      </div>

      <div class="balance" id="balance">
        🪙 250 Coins
      </div>

    </div>


    <!-- Categories -->

    <div class="categories">

      <button class="category-btn active" onclick="showCategory('food', this)">
        🍎 Food
      </button>

      <button class="category-btn" onclick="showCategory('pets', this)">
        🐾 Pets
      </button>

      <button class="category-btn" onclick="showCategory('accessories', this)">
        🎀 Accessories
      </button>

      <button class="category-btn" onclick="showCategory('themes', this)">
        🎨 Themes
      </button>

    </div>


    <!-- Items -->
    <div class="inventory-section">

    <div class="inventory-header">
        <h2>🎒 My Inventory</h2>
        <span id="inventoryCount">0 items</span>
    </div>

    <div class="inventory-list" id="inventoryList"></div>

    </div>
    <div class="item-grid" id="itemGrid"></div>

    <div class="empty-message" id="emptyMessage">
      No items available in this category yet. 🐾
    </div>

  </main>
    <!-- ---------- Purchase Modal ---------- -->

  <div class="modal-overlay" id="purchaseModal">

    <div class="purchase-modal">

      <div class="modal-icon" id="modalIcon">
        🛒
      </div>

      <h2>Confirm Purchase</h2>

      <p id="modalText">
        Buy this item?
      </p>

      <div class="modal-buttons">

        <button class="cancel-btn" onclick="closeModal()">
          Cancel
        </button>

        <button class="confirm-btn" onclick="confirmPurchase()">
          Buy
        </button>

      </div>

    </div>


  </div>
  <!-- ---------- Notification ---------- -->

    <div class="notification" id="notification">
        <span id="notificationIcon">⚠️</span>
        <span id="notificationText"></span>
    </div>
  <script src="js/state.js"></script>

  <script>

    

    const shopItems = [

      {
        name: "Apple",
        category: "food",
        icon: "🍎",
        price: 20,
        description: "A fresh and healthy snack."
      },

      {
        name: "Fish",
        category: "food",
        icon: "🐟",
        price: 30,
        description: "A tasty treat for hungry pets."
      },

      {
        name: "Carrot",
        category: "food",
        icon: "🥕",
        price: 15,
        description: "Crunchy and nutritious."
      },

      {
        name: "Pet Puppy",
        category: "pets",
        icon: "🐶",
        price: 150,
        description: "Add a cute puppy to your family."
      },

      {
        name: "Pet Kitten",
        category: "pets",
        icon: "🐱",
        price: 150,
        description: "A playful kitten companion."
      },

      {
        name: "Cute Hat",
        category: "accessories",
        icon: "🎩",
        price: 50,
        description: "A stylish hat for your pet."
      },

      {
        name: "Pink Bow",
        category: "accessories",
        icon: "🎀",
        price: 40,
        description: "A cute bow accessory."
      },

      {
        name: "Garden Theme",
        category: "themes",
        icon: "🌷",
        price: 100,
        description: "Give your pet area a garden look."
      }

    ];


    /* ---------- Display coins ---------- */

    function updateCoins() {

    const coins = getCoins();

    document.getElementById("navCoins").textContent =
        "🪙 " + coins;

    document.getElementById("balance").textContent =
        "🪙 " + coins + " Coins";

    }


    /* ---------- Display items ---------- */
function displayInventory() {

  const inventory = getInventory();

  const inventoryList =
    document.getElementById("inventoryList");

  const inventoryCount =
    document.getElementById("inventoryCount");

  inventoryList.innerHTML = "";


  // Count total items
  inventoryCount.textContent =
    inventory.length +
    (inventory.length === 1 ? " item" : " items");


  // Empty inventory
  if (inventory.length === 0) {

    inventoryList.innerHTML =
      '<div class="inventory-empty">' +
      'Your inventory is empty. Start shopping! 🛒' +
      '</div>';

    return;
  }


  // Group identical items
  const groupedItems = {};

  inventory.forEach(item => {

    if (groupedItems[item.name]) {

      groupedItems[item.name].quantity++;

    } else {

      groupedItems[item.name] = {
        ...item,
        quantity: 1
      };

    }

  });


  // Display grouped inventory
  Object.values(groupedItems).forEach(item => {

    const inventoryItem =
      document.createElement("div");

    inventoryItem.className =
      "inventory-item";

    inventoryItem.innerHTML = `

      <span class="inventory-item-icon">
        ${item.icon}
      </span>

      <span>
        ${item.name} × ${item.quantity}
      </span>

    `;

    inventoryList.appendChild(inventoryItem);

  });

}
    function showCategory(category, button) {

      const grid = document.getElementById("itemGrid");
      const emptyMessage = document.getElementById("emptyMessage");

      grid.innerHTML = "";

      document.querySelectorAll(".category-btn")
        .forEach(btn => btn.classList.remove("active"));

      button.classList.add("active");

      const filteredItems = shopItems.filter(
        item => item.category === category
      );

      if (filteredItems.length === 0) {

        emptyMessage.style.display = "block";
        return;

      }

      emptyMessage.style.display = "none";


      filteredItems.forEach(item => {

        const card = document.createElement("div");

        card.className = "item-card";

        card.innerHTML = `

          <div class="item-icon">
            ${item.icon}
          </div>

          <div class="item-name">
            ${item.name}
          </div>

          <div class="item-description">
            ${item.description}
          </div>

          <div class="item-price">
            🪙 ${item.price}
          </div>

          <button
            class="buy-btn"
            onclick="buyItem('${item.name}', ${item.price}, '${item.icon}')">
            Buy
          </button>

        `;

        grid.appendChild(card);

      });

    }


    /* ---------- Purchase ---------- */

    let selectedItem = null;
    function showNotification(message, icon = "⚠️") {

        const notification =
            document.getElementById("notification");

        const notificationIcon =
            document.getElementById("notificationIcon");

        const notificationText =
            document.getElementById("notificationText");

        notificationIcon.textContent = icon;
        notificationText.textContent = message;

        notification.style.display = "flex";

        setTimeout(() => {
            notification.style.display = "none";
        }, 2500);
    }

    function buyItem(name, price, icon) {

        const coins = getCoins();

        if (coins < price) {

            showNotification(
                "Not enough coins! You need " +
                (price - coins) +
                " more coins.",
                "🪙"
            );

            return;
        }

        selectedItem = {
            name: name,
            price: price,
            icon: icon,
            category: shopItems.find(item => item.name === name).category
        };

        document.getElementById("modalIcon").textContent =
            icon;

        document.getElementById("modalText").textContent =
            "Buy " + name + " for 🪙 " + price + " coins?";

        document.getElementById("purchaseModal").style.display =
            "flex";
    }


    function closeModal() {

    document.getElementById("purchaseModal").style.display =
        "none";

    selectedItem = null;
    }


    function confirmPurchase() {

        if (!selectedItem) {
            return;
        }

        const successfulPurchase = spendCoins(selectedItem.price);

        if (!successfulPurchase) {
            closeModal();
            return;
        }

        // Add purchased item to inventory
        addToInventory({
            name: selectedItem.name,
            category: selectedItem.category,
            icon: selectedItem.icon,
            price: selectedItem.price
        });

        displayInventory();

        updateCoins();

        document.getElementById("purchaseModal").style.display =
            "none";

        selectedItem = null;

    }


    /* ---------- Initial display ---------- */

    updateCoins();

    displayInventory();

    showCategory(
    "food",
    document.querySelector(".category-btn")
    );

  </script>

</body>
</html>
