AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Cloudpet backend (Account A) - HTTP API, Lambda, DynamoDB, EventBridge Scheduler, SES

Parameters:
  MailFrom:
    Type: String
    Default: ""
    Description: SES-verified sender address
  ChatProvider:
    Type: String
    Default: groq
    AllowedValues: [mock, groq, openai, bedrock]
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: ""
  GroqModel:
    Type: String
    Default: openai/gpt-oss-20b
  DemoSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Enables /api/demo/* helper routes (needs header x-demo-secret). Empty disables them.
  TimeScale:
    Type: String
    Default: "1"
    Description: Game-time speed-up for demos (1 = real time)
  EnableCloudFront:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: false = serve the site straight from S3 (HTTP). Use only while AWS is still verifying the account for CloudFront.
  EnableMonitoring:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Creates the CloudWatch dashboard and alarms. Set false if the account is still being verified for CloudWatch.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email for Lambda-error alarms

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  MonitoringOn: !Equals [!Ref EnableMonitoring, "true"]
  UseCloudFront: !Equals [!Ref EnableCloudFront, "true"]
  NoCloudFront: !Equals [!Ref EnableCloudFront, "false"]

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 1024
    Architectures: [arm64]
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        AUTH_MODE: cognito
        DEV_ROUTES: "false"
        CHAT_PROVIDER: !Ref ChatProvider
        GROQ_API_KEY: !Ref GroqApiKey
        GROQ_MODEL: !Ref GroqModel
        MAIL_PROVIDER: ses
        MAIL_FROM: !Ref MailFrom
        APP_URL: !If [UseCloudFront, !Sub "https://${SiteDistribution.DomainName}/home.html", !Sub "http://${SiteBucket}.s3-website-${AWS::Region}.amazonaws.com/home.html"]
        CORS_ORIGIN: !If [UseCloudFront, !Sub "https://${SiteDistribution.DomainName}", !Sub "http://${SiteBucket}.s3-website-${AWS::Region}.amazonaws.com"]
        DEMO_SECRET: !Ref DemoSecret
        TIME_SCALE: !Ref TimeScale
        DEFAULT_LAT: "13.08"
        DEFAULT_LON: "80.27"
        CHAT_DAILY_LIMIT: "30"

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  HttpApiMain:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: cloudpet
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!If [UseCloudFront, !Sub "https://${SiteDistribution.DomainName}", !Sub "http://${SiteBucket}.s3-website-${AWS::Region}.amazonaws.com"], "http://localhost:8080"]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type, x-utc-offset-minutes, x-demo-secret]
        MaxAge: 600

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApiMain
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApiMain
      Name: Cognito
      AuthorizerType: JWT
      IdentitySource: ["$request.header.Authorization"]
      JwtConfiguration:
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
        Audience: [!Ref UserPoolClient]

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApiMain
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  RouteHealth:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiMain
      RouteKey: GET /api/health
      AuthorizationType: NONE
      Target: !Sub integrations/${ApiIntegration}
  RouteCatalog:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiMain
      RouteKey: GET /api/catalog
      AuthorizationType: NONE
      Target: !Sub integrations/${ApiIntegration}
  RouteEverything:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApiMain
      RouteKey: ANY /{proxy+}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiMain}/*

  # ---------- Login: Cognito (self sign-up works, no email code needed for the demo) ----------
  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Timeout: 5
      MemorySize: 128
      InlineCode: |
        exports.handler = async (event) => {
          event.response.autoConfirmUser = true;
          event.response.autoVerifyEmail = true;
          return event;
        };

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      UserPoolName: cloudpet-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration: { CaseSensitive: false }
      Schema:
        - { Name: email, Required: true, Mutable: true }
        - { Name: name, Required: false, Mutable: true }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreSignUpFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: cloudpet-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }

  # ---------- Website: private S3 bucket behind CloudFront ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration: !If
        - UseCloudFront
        - { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
        - { BlockPublicAcls: true, BlockPublicPolicy: false, IgnorePublicAcls: true, RestrictPublicBuckets: false }
      WebsiteConfiguration: !If
        - UseCloudFront
        - !Ref AWS::NoValue
        - { IndexDocument: home.html, ErrorDocument: home.html }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  SiteOAC:
    Condition: UseCloudFront
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Condition: UseCloudFront
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Cloudpet website
        DefaultRootObject: home.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 4135ea2d-6df8-48a9-b4ea-2d3c8cd5f5c1   # CachingDisabled: edits show up immediately

  SiteBucketPolicy:
    Condition: UseCloudFront
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  SiteBucketPublicPolicy:
    Condition: NoCloudFront
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: node20
        Minify: false
        EntryPoints: [src/lambda.js]
        External: ["@aws-sdk/*"]
    Properties:
      CodeUri: .
      Handler: lambda.handler
      Timeout: 25
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: [ses:SendEmail, ses:SendRawEmail]
              Resource: "*"
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"

  SchedulerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: node20
        EntryPoints: [src/scheduler.js]
        External: ["@aws-sdk/*"]
    Properties:
      CodeUri: .
      Handler: scheduler.handler
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: [ses:SendEmail, ses:SendRawEmail]
              Resource: "*"
      Events:
        Every15Min:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 7
  SchedulerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SchedulerFunction}
      RetentionInDays: 7

  AlarmTopic:
    Type: AWS::SNS::Topic
  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  ApiErrorsAlarm:
    Condition: MonitoringOn
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  SchedulerErrorsAlarm:
    Condition: MonitoringOn
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scheduler Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref SchedulerFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Dashboard:
    Condition: MonitoringOn
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-overview
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"API requests, 4xx and 5xx","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/ApiGateway","Count","ApiId","${HttpApiMain}"],[".","4xx",".","."],[".","5xx",".","."]]}},
          {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"API latency (ms)","region":"${AWS::Region}","stat":"Average","period":300,"metrics":[["AWS/ApiGateway","Latency","ApiId","${HttpApiMain}"]]}},
          {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Lambda invocations and errors","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/Lambda","Invocations","FunctionName","${ApiFunction}"],[".","Errors",".","."],["AWS/Lambda","Invocations","FunctionName","${SchedulerFunction}"],[".","Errors",".","."]]}},
          {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"DynamoDB read and write units","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/DynamoDB","ConsumedReadCapacityUnits","TableName","${Table}"],[".","ConsumedWriteCapacityUnits",".","."]]}}
        ]}

Outputs:
  ApiUrl:
    Description: Give this to person B (frontend API base URL)
    Value: !Sub https://${HttpApiMain}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref Table
  ApiFunctionName:
    Value: !Ref ApiFunction
  SiteUrl:
    Description: Open this in the browser
    Value: !If [UseCloudFront, !Sub "https://${SiteDistribution.DomainName}", !Sub "http://${SiteBucket}.s3-website-${AWS::Region}.amazonaws.com"]
  SiteBucketName:
    Value: !Ref SiteBucket
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Region:
    Value: !Ref AWS::Region
  SchedulerFunctionName:
    Value: !Ref SchedulerFunction
  DashboardName:
    Condition: MonitoringOn
    Value: !Sub ${AWS::StackName}-overview