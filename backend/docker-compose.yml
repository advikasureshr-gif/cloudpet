# DynamoDB Local: the real DynamoDB API on your laptop. Data is kept in ./.dynamodb between restarts.
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: cloudpet-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    user: root
    ports:
      - "8000:8000"
    volumes:
      - ./.dynamodb:/home/dynamodblocal/data
